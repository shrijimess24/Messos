<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<meta name="description" content="Shri Ji Mess - Girls' Mess & Café">
<title>Shri Ji Mess</title>


<style>
.role-quick{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:6px 0 2px}
.role-quick button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:5px 8px;font-size:11px}
.compact-panel{max-width:520px;margin:0 auto}
.compact-panel .card{padding:10px;margin-bottom:8px}
.compact-panel h2{font-size:18px;margin:4px 0 8px}
.compact-panel h3{font-size:14px;margin:5px 0}
.compact-panel .grid{gap:7px}
.compact-panel .stat{padding:8px;font-size:12px}
.compact-panel button{padding:8px 10px;font-size:12px}
</style>

<style>
/* ===== Shri Ji Mess — Premium Medical Campus UI ===== */
:root{
 --bg:#f5f8fc;--card:#ffffff;--text:#18212f;--muted:#718096;
 --brand:#0f766e;--brand2:#22c55e;--accent:#2563eb;--warm:#f59e0b;
 --line:#e6edf4;--shadow:0 12px 35px rgba(15,45,75,.08)
}
body{background:
 radial-gradient(circle at 10% 0%,rgba(37,99,235,.10),transparent 25%),
 radial-gradient(circle at 100% 10%,rgba(16,185,129,.10),transparent 28%),
 #f5f8fc;color:var(--text)}
.app{max-width:760px}
.top{padding:18px 18px 8px;position:sticky;top:0;background:rgba(245,248,252,.86);backdrop-filter:blur(14px);z-index:15}
.brand{font-size:22px;letter-spacing:-.5px;color:#12304a;display:flex;align-items:center;gap:8px}
.brand:before{content:"✚";display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;font-size:18px;box-shadow:0 7px 18px rgba(37,99,235,.22)}
.page{padding:10px 15px 20px}
.card{border:1px solid rgba(220,230,240,.9);border-radius:22px;box-shadow:var(--shadow);padding:17px;margin:13px 0;background:rgba(255,255,255,.94)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b5f66 0%,#116b73 45%,#2563eb 100%);color:#fff;min-height:190px;padding:22px;border:0;box-shadow:0 18px 40px rgba(15,118,110,.22)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero:before{width:180px;height:180px;right:-70px;top:-75px}
.hero:after{width:110px;height:110px;right:90px;bottom:-65px}
.hero h2{font-size:25px;letter-spacing:-.7px;margin-bottom:5px}
.hero .muted,.hero .sub{color:rgba(255,255,255,.76)}
.hero-art{position:absolute;right:16px;bottom:13px;width:130px;height:130px;opacity:.98}
.hero-copy{position:relative;z-index:2;max-width:58%}
.hero-plan{margin-top:18px;display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:800}
.row{gap:10px}
.grid{gap:10px}
.btn{border-radius:14px;background:linear-gradient(135deg,#0f766e,#087f78);box-shadow:0 7px 18px rgba(15,118,110,.16);transition:.18s transform}
.btn:active{transform:scale(.98)}
.btn.secondary{background:#edf7f6;color:#0b716b;box-shadow:none;border:1px solid #d8eeeb}
.btn.danger{background:#fff0f0;color:#c24141;box-shadow:none}
.btn.small{border-radius:11px}
.pill{background:#eef7f4;color:#147365;border:1px solid #dceee9}
.meal{padding:12px 0;border-bottom:1px solid #edf1f5}
.meal-card{padding:14px 15px}
.meal-card h3{margin-bottom:3px}
.meal-card:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:linear-gradient(90deg,#0f766e,#60a5fa);margin-bottom:11px}
.meal .icon{font-size:28px}
.status{padding:5px 8px;border-radius:9px;background:#eef8f1}
.skipped{background:#fff0f0}
.section-title{font-weight:900}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-tile{padding:14px;border-radius:17px;background:linear-gradient(145deg,#fff,#f4f8fb);border:1px solid #e6edf4;text-align:left;box-shadow:0 7px 20px rgba(20,50,80,.05)}
.quick-tile b{display:block;margin-top:6px}
.quick-tile span{font-size:25px}
.notice{border-left:4px solid #f59e0b;background:linear-gradient(90deg,#fffaf0,#fff)}
.bottom{width:min(760px,100%);background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-top:1px solid #e4ebf2;padding-top:8px}
.nav{font-size:10px}
.nav b{font-size:21px}
.nav.active{color:#0f766e}
.role-quick{margin-top:8px}
.role-quick button{background:#fff;border-color:#dce6ef;color:#526477}
.modal .sheet{border-radius:25px 25px 0 0}
.product .pic{border-radius:16px;background:linear-gradient(145deg,#edf7f6,#eef4ff)}

/* ===== Restored base/structural CSS (was accidentally removed with old theme) ===== */
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
h1,h2,h3,p{margin-top:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}
.row{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr}
.sub{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:10px 0 4px}
.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 12px}
.pill{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.status{font-weight:800;font-size:13px}
.present{color:#0f766e}
.skipped{color:#c24141}
.btn{padding:12px 15px;font-weight:800;color:#fff;width:100%;text-align:center;display:inline-block;text-decoration:none}
.btn.green{background:#16a34a;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#0f766e,#087f78)}
.btn.small{width:auto;padding:8px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{font-size:26px}
.hidden{display:none!important}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#30251f;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;display:none}
.modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
.product{display:flex;gap:12px;align-items:center}
.pic{width:68px;height:68px;border-radius:14px;background:#f5e8dd;display:grid;place-items:center;font-size:30px;object-fit:cover}
.price{font-weight:900}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}
.nav{background:none;color:var(--muted);text-align:center}
.nav b{display:block;line-height:22px}
.adminTop{display:flex;gap:8px;overflow:auto;padding:8px 16px}
.tab{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#f3e7de;color:#6c5143;font-weight:800}
.tab.on{background:var(--brand);color:white}
.kitchen{background:#181614;color:#fff;min-height:100vh}
.kitchen .card{background:#26221f;border-color:#3d3732}
@media(min-width:600px){.page{padding:10px 24px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast" class="toast"></div>

<script>
const KEY="shriJiMessDemo";
const defaultState={
 student:{name:"Aarohi Sharma",phone:"9876543210",batch:"2026",room:"A-104",plan:"Monthly",amount:3800,start:"2026-09-01",end:"2026-09-30",active:true,payment:"Received"},
 dailyPrice:150, mealTimes:{Breakfast:"08:00",Lunch:"13:00",Snack:"17:00",Dinner:"20:00"},
 skips:{}, sickRequests:{}, remindedSkips:{}, leaves:[], products:[
  {id:1,name:"Veg Pizza",price:99,emoji:"🍕",available:true},
  {id:2,name:"White Sauce Pasta",price:69,emoji:"🍝",available:true},
  {id:3,name:"Cheese Veg Sandwich",price:50,emoji:"🥪",available:true},
  {id:4,name:"Cold Coffee",price:60,emoji:"🥤",available:true},
  {id:5,name:"Chocolate Shake",price:60,emoji:"🍫",available:true},
  {id:6,name:"Oreo Shake",price:60,emoji:"🥛",available:true}
 ],
 cart:[],orders:[{id:"SJ1042",items:[["White Sauce Pasta",1],["Cold Coffee",1]],total:129,status:"Preparing",student:"Aarohi Sharma",room:"A-104",payment:"Received"}],
 polls:{Tuesday:{meal:"Snack",q:"What should we make for Snack?",options:["Samosa","Dhokla","Sandwich","Maggi"]},Thursday:{meal:"Lunch",q:"What should we make for Lunch?",options:["Rajma Rice","Dal Tadka","Kadhi","Pulao"]},Saturday:{meal:"Breakfast",q:"What should we make for Breakfast?",options:["Poha","Sandwich","Aloo Paratha","Upma"]},Sunday:{meal:"Lunch",q:"What should we make for Lunch?",options:["Rajma Rice","Dal Tadka","Kadhi","Pulao"]}},
 votes:{}, pollTallies:{}, feedback:[], complaints:[], notices:[{text:"Today's dinner will be served at 8:30 PM.",time:new Date().toISOString()}], qr:"",whatsapp:"919876543210"
};
let state;
let storageLoadError=false;
function cloneDefault(){return JSON.parse(JSON.stringify(defaultState))}
try{
  const raw=localStorage.getItem(KEY);
  state=raw?JSON.parse(raw):cloneDefault();
  if(!state||typeof state!=="object")state=cloneDefault();
}catch(err){
  state=cloneDefault();
  storageLoadError=true;
}
state.sickRequests=state.sickRequests||{};
state.remindedSkips=state.remindedSkips||{};

function setMealServing(meal,serving){
 state.mealServing=state.mealServing||{};
 state.mealServing[meal]=serving;
 save();
 toast(`${meal}: ${serving==="Packed"?"📦 Pack":"🍽️ Dine-in"} selected`);
 meals();
}
function save(){
 try{
   localStorage.setItem(KEY,JSON.stringify(state));
   return true;
 }catch(err){
   toast("Storage error, kuch data save nahi ho paya");
   return false;
 }
}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2200)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function dayName(){return new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(new Date())}
function mealWindow(meal){
 let [h,m]=state.mealTimes[meal].split(":").map(Number), now=new Date(), target=new Date();target.setHours(h,m,0,0);
 let start=new Date(target-3600000);
 return {active:now>=start&&now<target,closed:now>=target,target}
}
function statusFor(meal){
 const k=today()+"_"+meal;
 if(state.skips[k]) return "Skipped";
 if(state.leaves.some(l=>today()>=l.from&&today()<=l.to)) return "Skipped";
 return "Present";
}
function sickCount(meal){return Object.keys(state.sickRequests).filter(k=>k===today()+"_"+meal&&state.sickRequests[k]).length}
function counts(meal){
 let skipped=Object.keys(state.skips).filter(k=>k.endsWith("_"+meal)&&k.startsWith(today())).length;
 let onLeave=state.leaves.some(l=>today()>=l.from&&today()<=l.to);
 if(onLeave) skipped+=1; // demo tracks one real student; leave adds just their own skip, not the whole mess
 let total=50, s=Math.min(total,skipped); return [total,total-s,s,total-s];
}
function nav(active){
 return `<div class="bottom">
 <button class="nav ${active=="home"?"active":""}" onclick="show('home')"><b>🏠</b>Home</button>
 <button class="nav ${active=="meals"?"active":""}" onclick="show('meals')"><b>🍽️</b>Meals</button>
 <button class="nav ${active=="poll"?"active":""}" onclick="show('poll')"><b>🗳️</b>Poll</button>
 <button class="nav ${active=="cafe"?"active":""}" onclick="show('cafe')"><b>☕</b>Café</button>
 <button class="nav ${active=="profile"?"active":""}" onclick="show('profile')"><b>👤</b>Profile</button></div>`
}
function shell(content,active){document.getElementById("app").innerHTML=`<div class="top"><div><div class="brand">🌸 Shri Ji Mess</div>
<div id="roleQuick" class="role-quick">
  <button onclick="show('home')">Student</button>
  <button onclick="show('admin')">🔐 Admin</button>
  <button onclick="show('kitchen')">👩‍🍳 Kitchen</button>
</div><div class="sub">Girls' Mess & Café</div></div><span class="pill">${esc(state.student.room)}</span></div><div class="page">${content}</div>${nav(active)}`}
function show(page){
 if(page=="home") home(); if(page=="meals") meals();if(page=="poll") poll();if(page=="cafe") cafe();if(page=="profile") profile();
}
function home(){
 let s=state.student;
 let mealMeta={Breakfast:["🍳","Breakfast"],Lunch:["🍛","Lunch"],Snack:["🥤","Snack"],Dinner:["🌙","Dinner"]};
 let mealsHtml=["Breakfast","Lunch","Snack","Dinner"].map(m=>{
   let w=mealWindow(m), st=statusFor(m), meta=mealMeta[m];
   return `<div class="meal">
     <div class="row">
       <div style="display:flex;gap:10px;align-items:center">
         <div style="width:42px;height:42px;border-radius:13px;background:#f0f7f7;display:grid;place-items:center;font-size:22px">${meta[0]}</div>
         <div><b>${meta[1]}</b><div class="sub">${state.mealTimes[m]}</div></div>
       </div>
       <div style="text-align:right"><div class="status ${st=="Present"?"present":"skipped"}">${st=="Present"?"PRESENT ✓":"SKIPPED ✕"}</div>${w.active&&st=="Present"?`<button class="btn small danger" style="margin-top:6px" onclick="skipMeal('${m}')">Skip</button>`:""}</div>
     </div>
   </div>`;
 }).join("");
 let pollToday=state.polls[dayName()];
 let pollVoteKey=today()+"_"+dayName();
 let pollVoted=state.votes[pollVoteKey];
 let pollWin=pollToday?pollWinner(pollVoteKey,pollToday.options):null;
 shell(`
 <div class="card hero">
   <div class="hero-copy">
     <div style="font-size:11px;letter-spacing:1.5px;font-weight:900;opacity:.78">SHRI JI • MEDICAL CAMPUS MESS</div>
     <h2>Hi, ${esc(s.name.split(" ")[0])} 👋</h2>
     <div class="muted">Room ${esc(s.room)} · Batch ${esc(s.batch)}</div>
     <div class="hero-plan">✦ ${s.plan=="Monthly"?"Monthly ₹"+s.amount:"Daily ₹"+s.amount} <span>• Active</span></div>
   </div>
   <svg class="hero-art" viewBox="0 0 160 160" aria-hidden="true">
     <circle cx="90" cy="82" r="57" fill="rgba(255,255,255,.12)"/>
     <path d="M58 56v23c0 23 18 41 41 41s41-18 41-41V56" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
     <circle cx="58" cy="53" r="9" fill="white"/>
     <path d="M52 125c7 11 19 17 33 17h14" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
     <circle cx="105" cy="142" r="11" fill="none" stroke="white" stroke-width="6"/>
     <path d="M89 82h17l7-13 8 27 8-18 6 9h13" fill="none" stroke="#b8fff0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
 </div>

 <div class="card">
   <div class="row"><div><div class="section-title">Today's meals</div><div class="sub">You're automatically Present unless you skip.</div></div><span class="pill">4 meals</span></div>
   ${mealsHtml}
 </div>

 ${pollToday?`<div class="card" style="background:linear-gradient(135deg,#f0f7ff,#fff)">
   <div class="row"><div><div class="section-title">🗳️ Today's Food Poll</div><div class="sub">${pollToday.meal} · Vote for your choice</div></div><button class="btn small" onclick="show('poll')">${pollVoted!=null?"View":"Vote"}</button></div>
   ${pollVoted!=null&&pollWin?`<div class="sub" style="margin-top:8px">🏆 Trending: <b>${esc(pollWin.name)}</b> (${pollWin.votes} vote${pollWin.votes>1?"s":""})</div>`:""}
 </div>`:""}

 <div class="section-title" style="margin:18px 2px 8px">Quick access</div>
 <div class="quick-actions">
   <button class="quick-tile" onclick="show('cafe')"><span>☕</span><b>Shri Ji Café</b><small class="muted">Order & pickup</small></button>
   <button class="quick-tile" onclick="leaveModal()"><span>🏠</span><b>Leave Mode</b><small class="muted">Manage leave</small></button>
   <button class="quick-tile" onclick="feedbackModal()"><span>⭐</span><b>Feedback</b><small class="muted">Share experience</small></button>
   <button class="quick-tile" onclick="complaintModal()"><span>📝</span><b>Request Help</b><small class="muted">Complaint / request</small></button>
 </div>

 ${(()=>{let an=activeNotices();return `<div class="card notice"><div class="row"><div><b>📢 Campus notice</b><div style="margin-top:6px">${an.length?esc(an[0].text):"No new notices."}</div></div><button class="btn small secondary" onclick="noticesModal()">View all</button></div></div>`})()}
 `, "home")
}
function skipMeal(m){let w=mealWindow(m);if(!w.active){toast("Skip window is closed");return}state.skips[today()+"_"+m]=true;if(save())toast(m+" skipped");home()}
function toggleSickMeal(m){
 const w=mealWindow(m);
 if(w.closed){toast("Too late — meal already prepared");return}
 const key=today()+"_"+m;
 if(state.sickRequests[key]) delete state.sickRequests[key];
 else state.sickRequests[key]=true;
 save();
 toast(state.sickRequests[key]?"🤒 Light diet requested for "+m:"Light diet request removed");
 meals();
}
function meals(){
 const mealNames=["Breakfast","Lunch","Snack","Dinner"];
 shell(`<div class="card hero"><h2>🍽️ Today's Meals</h2><p>Meal automatically counts you as <b>Present ✅</b>. You only need to skip when required.</p></div>
 ${mealNames.map(m=>{
   const st=statusFor(m);
   const w=mealWindow(m);
   const choice=state.mealServing?.[m]||"Dine-in";
   return `<div class="card meal-card">
    <div class="row"><h3>${m}</h3><span class="pill">${st==="Skipped"?"SKIPPED ❌":"PRESENT ✅"}</span></div>
    <div class="sub">${state.mealTimes[m]} • Skip window: 1 hour before meal</div>
    <div style="margin-top:10px"><b>How will you take your meal?</b>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn small ${choice==="Dine-in"?"primary":"secondary"}" onclick="setMealServing('${m}','Dine-in')">🍽️ Dine-in</button>
        <button class="btn small ${choice==="Packed"?"primary":"secondary"}" onclick="setMealServing('${m}','Packed')">📦 Pack</button>
      </div>
    </div>
    ${w.active&&st==="Present"?`<button class="btn danger" style="margin-top:10px" onclick="skipMeal('${m}')">SKIP ${m.toUpperCase()}</button>`:""}
    ${!w.closed?`<button class="btn small ${state.sickRequests[today()+"_"+m]?"primary":"secondary"}" style="margin-top:8px" onclick="toggleSickMeal('${m}')">${state.sickRequests[today()+"_"+m]?"🤒 Light Diet Requested — Cancel":"🤒 Not Feeling Well? Request Light Diet"}</button>`:""}
    ${!w.active?`<div class="sub" style="margin-top:8px">Pack/Dine-in can be selected anytime. Skip is available only during the 1-hour window.</div>`:""}
   </div>`;
 }).join("")}`,"meals")
}

function pollWinner(voteKey,options){
 let tallies=state.pollTallies?.[voteKey];
 if(!tallies||!tallies.some(v=>v>0))return null;
 let maxV=Math.max(...tallies), idx=tallies.indexOf(maxV);
 return {index:idx,name:options[idx],votes:maxV};
}
function poll(){
 let d=dayName(), p=state.polls[d];
 if(!p){shell(`<div class="card hero"><h2>🗳️ Food Poll</h2><p>No poll today.</p><p class="muted">Poll days: Tuesday Snack • Thursday Lunch • Saturday Breakfast • Sunday Lunch.</p></div>`,"poll");return}
 let voteKey=today()+"_"+d, voted=state.votes[voteKey];
 let tallies=state.pollTallies?.[voteKey]||p.options.map(()=>0);
 let totalVotes=tallies.reduce((a,v)=>a+v,0);
 let win=pollWinner(voteKey,p.options);
 shell(`<div class="card hero"><h2>🗳️ ${p.meal} Poll</h2><p>${esc(p.q)}</p></div><div class="card">${p.options.map((o,i)=>{
   let pct=totalVotes?Math.round(tallies[i]/totalVotes*100):0;
   return voted!=null
     ?`<div style="margin:8px 0"><div class="row"><span>${win&&win.index===i?"🏆 ":"○ "}${esc(o)}${voted===i?" <b>(your vote)</b>":""}</span><b>${pct}%</b></div><div style="height:8px;border-radius:6px;background:#eef2f6;margin-top:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${win&&win.index===i?"#16a34a":"#0f766e"}"></div></div></div>`
     :`<button class="btn secondary" style="margin:5px 0" onclick="vote('${voteKey}',${i})">○ ${esc(o)}</button>`;
 }).join("")}${voted!=null?`<p class="present" style="margin-top:12px">Your vote is recorded. Attendance is not affected. Total votes: ${totalVotes}.</p>`:""}</div>`,"poll")
}

function vote(d,i){
 state.votes[d]=i;
 state.pollTallies=state.pollTallies||{};
 let optCount=(state.polls[dayName()]&&state.polls[dayName()].options.length)||4;
 state.pollTallies[d]=state.pollTallies[d]||Array(optCount).fill(0);
 state.pollTallies[d][i]=(state.pollTallies[d][i]||0)+1;
 if(save())toast("Vote recorded");poll()
}
function cafe(){
 let products=state.products.filter(p=>p.available);
 shell(`<div class="card hero"><h2>☕ Shri Ji Café</h2><p>Order from your room and collect it at the mess. <b>No delivery.</b></p></div>
 ${state.orders.length?`<button class="btn secondary" onclick="repeatLastOrder()" style="margin-bottom:10px">🔁 Repeat Last Order</button>`:""}
 <div class="card"><h3>Menu</h3>${products.map(p=>`<div class="meal product"><div class="pic">${p.emoji}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="price">₹${p.price}</div></div><button class="btn small" onclick="addCart(${p.id})">Add</button></div>`).join("")}</div>
 <div class="card"><div class="row"><h3>🛒 Cart</h3><b>${state.cart.reduce((a,x)=>a+x.qty,0)} items</b></div>${cartHtml()}${state.cart.length?`<div class="card" style="margin:8px 0"><b>How do you want your order?</b><div style="display:flex;gap:8px;margin-top:8px"><label style="flex:1;border:1px solid #ddd;border-radius:12px;padding:10px;text-align:center"><input type="radio" name="serving" value="Packed" checked> 📦 Packed</label><label style="flex:1;border:1px solid #ddd;border-radius:12px;padding:10px;text-align:center"><input type="radio" name="serving" value="Dine-in"> 🍽️ Dine-in</label></div></div><button class="btn" onclick="checkout()">Continue to Payment ₹${cartTotal()}</button>`:"<p class=muted>Cart is empty.</p>"}</div>
 <div class="card"><h3>📦 My Orders</h3>${state.orders.length?`
   ${(()=>{const pending=state.orders.filter(o=>o.payment==="Pending");const pendingTotal=pending.reduce((a,o)=>a+o.total,0);return pending.length?`<div style="background:#fff7f2;border-radius:12px;padding:10px;margin-bottom:10px"><b>💳 Pending Payments</b><div class="row"><span>${pending.length} order${pending.length>1?"s":""}</span><b>₹${pendingTotal}</b></div><button class="btn small" onclick="payAllPendingCafeOrders()">💳 Pay Total ₹${pendingTotal}</button></div>`:""})()}
   ${state.orders.map(o=>`<div class="meal"><div class="row"><b>#${o.id}</b><span class="pill">${o.status}</span></div><div>${o.items.map(x=>esc(x[0])+" × "+x[1]).join("<br>")}</div><div style="margin-top:4px"><b>₹${o.total}</b> • ${o.serving==="Dine-in"?"🍽️ Dine-in":"📦 Packed"}</div><div class="sub">Payment: ${esc(o.payment||"Pending")}</div>${o.status=="Ready for Pickup"?`<p class="present">🟢 READY FOR PICKUP • Pickup PIN: ${o.id.slice(-4)}</p>`:""}${o.payment==="Pending"?`<button class="btn small" style="margin-top:8px" onclick="payExistingCafeOrder('${o.id}')">💳 Pay ₹${o.total}</button>`:""}</div>`).join("")}`:"<p class=muted>No orders yet.</p>"}</div>`,"cafe")
}
function cartHtml(){
 return state.cart.map(x=>`<div class="meal" style="padding:9px 0">
   <div class="row">
    <span>${x.emoji} <b>${esc(x.name)}</b></span>
    <b>₹${x.price*x.qty}</b>
   </div>
   <div class="row" style="margin-top:7px">
    <div style="display:flex;align-items:center;gap:7px">
      <button class="btn small secondary" onclick="changeCartQty(${x.id},-1)">−</button>
      <b style="min-width:22px;text-align:center">${x.qty}</b>
      <button class="btn small secondary" onclick="changeCartQty(${x.id},1)">+</button>
    </div>
    <button class="btn small danger" onclick="removeCart(${x.id})">🗑️ Remove</button>
   </div>
 </div>`).join("")
}

function cartTotal(){return state.cart.reduce((a,x)=>a+x.price*x.qty,0)}
function repeatLastOrder(){
 let last=state.orders[0];
 if(!last){toast("No past order found");return}
 let added=0;
 last.items.forEach(([name,qty])=>{
   let p=state.products.find(x=>x.name===name&&x.available);
   if(!p)return;
   added++;
   let x=state.cart.find(c=>c.id===p.id);
   if(x)x.qty+=qty; else state.cart.push({...p,qty});
 });
 save();
 toast(added?"Last order added to cart":"Those items aren't available right now");
 cafe();
}
function addCart(id){let p=state.products.find(x=>x.id==id),x=state.cart.find(x=>x.id==id);if(x)x.qty++;else state.cart.push({...p,qty:1});if(save())toast(p.name+" added");cafe()}
function changeCartQty(id,delta){
 const x=state.cart.find(i=>i.id==id);
 if(!x)return;
 x.qty+=delta;
 if(x.qty<=0)state.cart=state.cart.filter(i=>i.id!=id);
 save();cafe();
}
function removeCart(id){
 const x=state.cart.find(i=>i.id==id);
 state.cart=state.cart.filter(i=>i.id!=id);
 if(save())toast((x?.name||"Item")+" removed from cart");cafe();
}
function checkout(){
 if(!state.cart.length){toast("Cart is empty");return}
 const serving=document.querySelector('input[name="serving"]:checked')?.value||"Packed";
 const total=cartTotal(), id="SJ"+String(Math.floor(1000+Math.random()*9000));
 state.pendingCafe={id,items:state.cart.map(x=>[x.name,x.qty]),total,serving,student:state.student.name,room:state.student.room,phone:state.student.phone};
 save(); paymentModal("cafe");
}
function payAllPendingCafeOrders(){
 const pending=state.orders.filter(o=>o.payment==="Pending");
 if(!pending.length){toast("No pending café payment");return}
 state.pendingCafe={
   id:"MULTI",
   items:pending.flatMap(o=>o.items),
   total:pending.reduce((a,o)=>a+o.total,0),
   serving:"Multiple",
   student:state.student.name,
   room:state.student.room,
   existing:true,
   orderIds:pending.map(o=>o.id)
 };
 save();paymentModal("cafe");
}
function attendanceSummary(){
 let ym=today().slice(0,7);
 let skipped=Object.keys(state.skips).filter(k=>k.startsWith(ym)&&state.skips[k]).length;
 let leaveDays=state.leaves.reduce((a,l)=>{
   let from=l.from<ym+"-01"?ym+"-01":l.from, to=l.to;
   if(!to.startsWith(ym)&&!from.startsWith(ym))return a;
   let d1=new Date(from),d2=new Date(to<ym+"-31"?to:ym+"-31");
   let days=Math.max(0,Math.round((d2-d1)/86400000)+1);
   return a+days;
 },0);
 return {skipped,leaveDays};
}
function profile(){let s=state.student;let att=attendanceSummary();shell(`<div class="card"><h2>👤 Profile</h2><label class="label">Name</label><input class="input" id="pn" value="${esc(s.name)}"><label class="label">Phone Number</label><input class="input" id="pph" type="tel" maxlength="10" value="${esc(s.phone||"")}"><label class="label">Batch</label><input class="input" id="pb" value="${esc(s.batch)}"><label class="label">Room No.</label><input class="input" id="pr" value="${esc(s.room)}"><button class="btn" onclick="saveProfile()">Save Profile</button>${s.phone?`<a class="btn secondary" style="margin-top:8px" href="tel:${esc(s.phone)}">📞 Call this number</a>`:""}</div>
 <div class="card"><h3>Plan</h3><div class="row"><span>${s.plan} Plan</span><b>₹${s.amount}</b></div><p class="muted">${s.start} → ${s.end}</p><span class="pill">${s.payment}</span><button class="btn secondary" style="margin-top:12px" onclick="paymentModal()">💳 Payment / QR</button></div>
 <div class="card"><h3>📊 This Month's Attendance</h3><div class="row"><span class="sub">Meals skipped</span><b>${att.skipped}</b></div><div class="row" style="margin-top:6px"><span class="sub">Leave days</span><b>${att.leaveDays}</b></div></div>
 <div class="card"><h3>🏠 Leave</h3>${state.leaves.length?state.leaves.map(l=>`<p>On leave: ${l.from} → ${l.to} <button class="btn small danger" onclick="cancelLeave()">Cancel</button></p>`).join(""):"<p class=muted>No active leave.</p>"}</div>
 <div class="card"><h3>⚙️ Demo</h3><button class="btn secondary" onclick="admin()">Open Admin Panel</button><button class="btn secondary" style="margin-top:8px" onclick="kitchen()">Open Kitchen Panel</button></div>`,"profile")}
function saveProfile(){
 let ph=document.getElementById("pph").value.replace(/\D/g,"");
 if(ph&&ph.length!==10){toast("Enter a valid 10-digit phone number");return}
 state.student.name=document.getElementById("pn").value;
 state.student.phone=ph;
 state.student.batch=document.getElementById("pb").value;
 state.student.room=document.getElementById("pr").value;
 if(save())toast("Profile saved");profile()
}
function closeModal(){let m=document.querySelector(".modal");if(m)m.remove()}
function modal(html,dismissible=true){let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">${html}</div>`;if(dismissible)m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function leaveModal(){modal(`<h2>🏠 Leave Mode</h2><label class=label>From</label><input class=input type=date id=lf value="${today()}"><label class=label>To</label><input class=input type=date id=lt value="${today()}"><button class=btn onclick="setLeave()">Activate Leave</button>`)}
function setLeave(){let a=document.getElementById("lf").value,b=document.getElementById("lt").value;if(!a||!b||b<a)return toast("Select valid dates");state.leaves=[{from:a,to:b,createdAt:new Date().toISOString()}];save();closeModal();toast("Leave activated");home()}
function cancelLeave(){state.leaves=[];if(save())toast("Leave cancelled");profile()}
function paymentModal(mode="monthly"){
 const isCafe=mode==="cafe", p=state.pendingCafe;
 const qr=state.qr
   ? `<img src="${state.qr}" alt="UPI QR" style="width:190px;height:190px;object-fit:contain;border-radius:12px;border:1px solid #eee">`
   : `<div style="width:190px;height:190px;margin:auto;border:2px dashed #ccc;border-radius:12px;display:grid;place-items:center;color:#888">UPI QR<br><small>Admin QR not uploaded</small></div>`;
 const msg=isCafe&&p
   ? `Shri Ji Cafe Payment Screenshot - Order ${p.id} - ${p.student} - Room ${p.room} - ₹${p.total}`
   : `Shri Ji Mess Payment Screenshot - ${state.student.name} Room ${state.student.room}`;
 const wa=state.whatsapp||"";
 const waUrl=wa ? `https://wa.me/${String(wa).replace(/\D/g,"")}?text=${encodeURIComponent(msg)}` : "#";
 const waAttr=wa ? "" : `onclick="event.preventDefault();toast('Admin WhatsApp number not added')"`;
 const summary=isCafe&&p
   ? `<div class="card" style="text-align:left"><b>${p.id==="MULTI"?"Combined Café Payment":"Order #"+p.id}</b><br>${p.items.map(x=>`${esc(x[0])} × ${x[1]}`).join("<br>")}<br><b>Total Payment: ₹${p.total}</b>${p.serving!=="Multiple"?`<br>${p.serving==="Dine-in"?"🍽️ Dine-in":"📦 Packed"}`:""}</div>`
   : "";
 const done=isCafe
   ? `<button class="btn" onclick="confirmCafePayment()">✅ Screenshot Sent — Confirm Order</button>`
   : `<button class="btn" onclick="confirmMessPayment()">✅ Screenshot Sent — Done</button>`;
 modal(`<div class="modal-head"><b>${isCafe?"☕ Shri Ji Café Payment":"Shri Ji Mess Payment"}</b><span onclick="closeModal()">✕</span></div>
 ${summary}
 <div style="text-align:center">${qr}
 <p><b>QR Scan karke payment karein</b><br>aur payment ka screenshot WhatsApp par bhej dein.</p>
 <a class="btn primary" href="${waUrl}" target="_blank" ${waAttr}>📲 Send Payment Screenshot on WhatsApp</a>
 ${done}</div>`);
}
function confirmCafePayment(){
 const p=state.pendingCafe;
 if(!p){toast("No pending café payment");return}
 if(p.existing){
   if(p.orderIds?.length){
     state.orders.forEach(o=>{if(p.orderIds.includes(o.id)&&o.payment==="Pending")o.payment="Screenshot Sent / Pending Verification";});
   }else{
     let o=state.orders.find(x=>x.id===p.id);
     if(o)o.payment="Screenshot Sent / Pending Verification";
   }
 }else{
   state.orders=state.orders||[];
   state.orders.unshift({
     id:p.id,items:p.items,total:p.total,serving:p.serving,
     student:p.student,room:p.room,phone:p.phone,
     payment:"Screenshot Sent / Pending Verification",
     status:"New",created:new Date().toLocaleString()
   });
   state.cart=[];
 }
 state.pendingCafe=null;
 save();closeModal();toast("Order confirmed — payment pending Admin verification");cafe();
}
function confirmMessPayment(){
 state.student.payment="Screenshot Sent / Pending Verification";
 save();closeModal();toast("Payment noted — admin will verify");
 profile();
}
function payExistingCafeOrder(id){
 const o=state.orders.find(x=>x.id===id);
 if(!o)return;
 state.pendingCafe={
   id:o.id,items:o.items,total:o.total,serving:o.serving||"Packed",
   student:o.student,room:o.room,existing:true
 };
 save();paymentModal("cafe");
}
function feedbackModal(){modal(`<h2>⭐ Food Feedback</h2><label class=label>Rating</label><select class=input id=fr><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input class=input id=ft placeholder="Taste feedback"><input class=input id=fq placeholder="Quality feedback"><input class=input id=fn placeholder="Quantity feedback"><textarea class=input id=fs placeholder="Suggestion"></textarea><button class=btn onclick="sendFeedback()">Submit Feedback</button>`)}
function sendFeedback(){state.feedback.unshift({student:state.student.name,rating:document.getElementById("fr").value,taste:document.getElementById("ft").value,quality:document.getElementById("fq").value,quantity:document.getElementById("fn").value,suggestion:document.getElementById("fs").value,time:new Date().toISOString()});save();closeModal();toast("Thank you for your feedback")}

function admin(){
 document.getElementById("app").innerHTML=`<div class="top"><div><div class=brand>🌸 Shri Ji Mess</div><div class=sub>Admin Panel</div></div><button class="btn small secondary" onclick="show('home')">Student</button></div>

 <div class=grid><div class=card><b>👩 Active Girls</b><h2>50</h2></div><div class=card><b>💳 Pending Payments</b><h2>${state.student.payment=="Pending"?1:0}</h2></div><div class=card><b>🛒 New Orders</b><h2>${state.orders.filter(o=>o.status=="New").length}</h2></div><div class=card><b>📝 Complaints</b><h2>${state.complaints.filter(c=>c.status!="Solved").length}</h2></div></div>
 <div class=card><h3>☕ Café Orders</h3>${state.orders.map(o=>`<div class=meal><div class=row><b>#${o.id}</b><span class=pill>${o.status}</span></div><div class=sub>${esc(o.student)} • Room ${esc(o.room)}${o.phone?` • <a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a>`:""} • ₹${o.total}</div><div class=row style="margin-top:6px"><span class=sub>Payment: ${esc(o.payment||"Pending")}</span>${o.payment!=="Received"?`<button class="btn small" onclick="markOrderPaid('${o.id}')">Mark Payment Received</button>`:""}</div></div>`).join("")||"<p class=muted>No orders yet.</p>"}</div>
 <div class=card><h3>Recent Feedback</h3>${state.feedback.slice(0,4).map(f=>`<p>⭐ ${f.rating}/5 — ${esc(f.taste||"No taste comment")}</p>`).join("")||"<p class=muted>No feedback yet.</p>"}</div>
 <div class=card><h3>📢 Notices</h3><input class=input id=notice placeholder="New announcement"><button class=btn onclick="addNotice()">Post Notice</button></div>
 <div class=card><h3>📝 Complaints</h3>${state.complaints.map(c=>`<div class=meal><b>${esc(c.student)}</b>${c.phone?` <a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a>`:""}<p>${esc(c.text)}</p><span class=pill>${c.status}</span><button class="btn small" style="float:right" onclick="cycleComplaint(${c.id})">Update</button></div>`).join("")||"<p class=muted>None</p>"}</div>
 </div>`}

function addNotice(){let n=document.getElementById("notice").value.trim();if(n){state.notices.unshift({text:n,time:new Date().toISOString()});if(save())toast("Notice posted");admin()}}
function activeNotices(){
 let cutoff=Date.now()-7*86400000;
 return (state.notices||[]).map(n=>typeof n==="string"?{text:n,time:new Date().toISOString()}:n).filter(n=>new Date(n.time).getTime()>=cutoff);
}
function noticesModal(){
 let all=(state.notices||[]).map(n=>typeof n==="string"?{text:n,time:new Date().toISOString()}:n);
 modal(`<h2>📢 All Notices</h2>${all.length?all.map(n=>`<div class="meal"><div>${esc(n.text)}</div><div class="sub">${new Date(n.time).toLocaleString()}</div></div>`).join(""):"<p class=muted>No notices yet.</p>"}`);
}
function cycleComplaint(id){let c=state.complaints.find(x=>x.id==id);c.status=c.status=="Pending"?"In Progress":c.status=="In Progress"?"Solved":"Pending";save();admin()}
function studentsAdmin(){document.getElementById("app").innerHTML=`<div class=top><div><div class=brand>🌸 Students</div><div class=sub>Student Management</div></div><button class="btn small secondary" onclick="admin()">Back</button></div><div class=page><div class=card><h3>${esc(state.student.name)}</h3><p>Room ${esc(state.student.room)} • Batch ${esc(state.student.batch)}</p><p>📞 <a href="tel:${esc(state.student.phone||"")}">${esc(state.student.phone||"Not added")}</a></p><label class=label>Plan Amount</label><input class=input type=number id=pa value="${state.student.amount}"><label class=label>Start Date</label><input class=input type=date id=ps value="${state.student.start}"><label class=label>End Date</label><input class=input type=date id=pe value="${state.student.end}"><label class=label>Payment</label><select class=input id=pp><option ${state.student.payment=="Received"?"selected":""}>Received</option><option ${state.student.payment=="Pending"?"selected":""}>Pending</option><option ${state.student.payment=="Screenshot Sent / Pending Verification"?"selected":""}>Screenshot Sent / Pending Verification</option></select><button class=btn onclick="saveStudentAdmin()">Save Student</button></div><div class=card><h3>Meal History</h3><p class=muted>Today: Breakfast ${statusFor("Breakfast")}, Lunch ${statusFor("Lunch")}, Snack ${statusFor("Snack")}, Dinner ${statusFor("Dinner")}</p></div></div>`}

function settingsAdmin(){document.getElementById("app").innerHTML=`<div class=top><div><div class=brand>⚙️ Settings</div><div class=sub>Payment & Meal Timings</div></div><button class="btn small secondary" onclick="admin()">Back</button></div><div class=page><div class=card><h3>Payment Settings</h3><label class=label>WhatsApp Number</label><input class=input id=wa value="${state.whatsapp}"><label class=label>UPI QR</label><input class=input type=file accept="image/*" onchange="qrFile(this)"><div class=muted>Demo version shows a QR placeholder. Upload is stored locally in this browser.</div><button class=btn onclick="saveSettings()">Save Payment Settings</button></div><div class=card><h3>Meal Timings</h3>${Object.keys(state.mealTimes).map(m=>`<label class=label>${m}</label><input class=input type=time id="tm${m}" value="${state.mealTimes[m]}">`).join("")}<p class=muted>Skip Window = exactly 1 hour before meal time.</p><button class=btn onclick="saveTimes()">Save Timings</button></div>
 <div class=card><h3>🗳️ Poll Options</h3><p class=muted>Set tomorrow's poll options a day before. If you don't update, last week's options stay active automatically.</p>${Object.keys(state.polls).map(d=>{let p=state.polls[d];return `<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><b>${d} → ${p.meal}</b><label class=label>Question</label><input class=input id="pq_${d}" value="${esc(p.q)}"><label class=label>Options (comma separated)</label><input class=input id="po_${d}" value="${esc(p.options.join(", "))}"><button class="btn small" onclick="savePollOptions('${d}')">Save ${d} Poll</button></div>`}).join("")}</div>

 delete state.pollTallies[voteKey];
 delete state.votes[voteKey];

let kitchenTimer=null, kitchenSeenIds=null;
function beep(){
 try{
   let ctx=new (window.AudioContext||window.webkitAudioContext)();
   let o=ctx.createOscillator(),g=ctx.createGain();
   o.connect(g);g.connect(ctx.destination);
   o.frequency.value=880;g.gain.value=.15;
   o.start();setTimeout(()=>{o.stop();ctx.close()},280);
 }catch(err){}
}
function stopKitchenWatch(){if(kitchenTimer){clearInterval(kitchenTimer);kitchenTimer=null}}
function watchKitchenOrders(){
 stopKitchenWatch();
 kitchenSeenIds=new Set(state.orders.map(o=>o.id));
 kitchenTimer=setInterval(()=>{
   try{
     let raw=localStorage.getItem(KEY);
     if(!raw)return;
     let fresh=JSON.parse(raw).orders||[];
     let newOnes=fresh.filter(o=>!kitchenSeenIds.has(o.id));
     if(newOnes.length){
       state.orders=fresh;
       kitchenSeenIds=new Set(fresh.map(o=>o.id));
       beep();toast(newOnes.length+" new order"+(newOnes.length>1?"s":"")+" received");
       kitchen();
     }
   }catch(err){}
 },4000);
}
function kitchen(){
 document.body.className="kitchen";
 watchKitchenOrders();
 let pToday=state.polls[dayName()], pKey=today()+"_"+dayName(), pWin=pToday?pollWinner(pKey,pToday.options):null;
 document.getElementById("app").innerHTML=`<div class=top><div><div class=brand style="color:#ffb27d">🌸 Shri Ji Mess</div><div class=sub style="color:#aaa">Kitchen Panel</div></div><button class="btn small secondary" onclick="stopKitchenWatch();document.body.className='';show('home')">Exit</button></div><div class=page>
 ${pToday?`<div class=card><h3>🗳️ ${pToday.meal} Poll Result</h3>${pWin?`<h1 style="margin:4px 0">${esc(pWin.name)}</h1><div class=sub>${pWin.votes} vote${pWin.votes>1?"s":""} so far</div>`:`<p class=muted>No votes yet</p>`}</div>`:""}
 <h2>🍽️ Today's Preparation</h2>${["Breakfast","Lunch","Snack","Dinner"].map(m=>{let c=counts(m),sc=sickCount(m);return `<div class=card><div class=row><div><div style="font-size:28px">${m=="Breakfast"?"🍳":m=="Lunch"?"🍛":m=="Snack"?"☕":"🌙"}</div><b>${m}</b></div><h1>${c[3]}</h1></div><div class=sub>MEALS TO PREPARE${sc?` • 🤒 ${sc} light diet`:""}</div></div>`}).join("")}
 <h2>☕ Café Orders</h2>${state.orders.map(o=>`<div class=card><div class=row><b>#${o.id}</b><span class=pill>${o.status}</span></div><p>${o.items.map(x=>esc(x[0])+" × "+x[1]).join("<br>")}</p><b>Room ${esc(o.room)}</b>${o.phone?`<div style="margin-top:4px"><a class="btn small secondary" href="tel:${esc(o.phone)}">📞 Call ${esc(o.phone)}</a></div>`:""}<div style="display:flex;gap:7px;margin-top:10px"><button class="btn small" onclick="orderStatus('${o.id}','Preparing')">PREPARING</button><button class="btn small green" onclick="orderStatus('${o.id}','Ready for Pickup')">READY</button><button class="btn small secondary" onclick="orderStatus('${o.id}','Completed')">COMPLETED</button></div></div>`).join("")}</div>`}
function orderStatus(id,s){let o=state.orders.find(x=>x.id==id);o.status=s;save();kitchen()}
function register(){modal(`<h2>🌸 Welcome to Shri Ji Mess</h2><p class=muted>Registration is simple — only 4 details.</p><label class=label>Name</label><input class=input id=rn placeholder="Your name"><label class=label>Phone Number</label><input class=input id=rph type=tel placeholder="10-digit mobile number" maxlength=10><label class=label>Batch</label><input class=input id=rb placeholder="2026"><label class=label>Room No.</label><input class=input id=rr placeholder="A-104"><button class=btn onclick="registerSave()">Continue</button>`,false)}
function registerSave(){
 let n=document.getElementById("rn").value.trim(),ph=document.getElementById("rph").value.replace(/\D/g,""),b=document.getElementById("rb").value.trim(),r=document.getElementById("rr").value.trim();
 if(!n||!ph||!b||!r)return toast("Please fill all fields");
 if(ph.length!==10)return toast("Enter a valid 10-digit phone number");
 state.student={...defaultState.student,name:n,phone:ph,batch:b,room:r,plan:"",amount:0,start:"",end:"",active:true,payment:"Pending"};
 state.orders=[];
 state.cart=[];
 state.skips={};
 state.leaves=[];
 state.votes={};
 state.mealServing={};
 save();
 closeModal();
 planModal();
}
function planModal(){modal(`<h2>Choose Mess Plan</h2><div class=card><div class=row><div><b>Monthly Plan</b><div class=muted>Full month</div></div><b>₹3,800</b></div><button class=btn style="margin-top:10px" onclick="choosePlan('Monthly')">Select Monthly</button></div><div class=card><div class=row><div><b>Daily Plan</b><div class=muted>Admin configured</div></div><b>₹${state.dailyPrice}/day</b></div><button class="btn secondary" style="margin-top:10px" onclick="choosePlan('Daily')">Select Daily</button></div>`)}
function choosePlan(p){state.student.plan=p;state.student.amount=p=="Monthly"?3800:state.dailyPrice;save();closeModal();paymentModal()}
function checkSkipReminders(){
 const now=new Date();
 ["Breakfast","Lunch","Snack","Dinner"].forEach(m=>{
   const w=mealWindow(m), key=today()+"_"+m, msLeft=w.target-now;
   if(!w.closed && msLeft>0 && msLeft<=15*60000 && statusFor(m)==="Present" && !state.remindedSkips[key]){
     state.remindedSkips[key]=true;
     save();
     toast("⏰ "+m+" ka skip window 15 min me band ho raha hai!");
   }
 });
}
function boot(){
 home();
 if(storageLoadError)setTimeout(()=>toast("Storage error, kuch data save nahi ho paya"),350);
 let hasStored=false;
 try{hasStored=!!localStorage.getItem(KEY)}catch(err){}
 if(!hasStored)setTimeout(register,300);
 checkSkipReminders();
 setInterval(checkSkipReminders,60000);
}
boot();
</script>
</body></html>
