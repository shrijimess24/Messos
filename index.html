<style>
.role-quick{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:6px 0 2px}
.role-quick button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:5px 8px;font-size:11px}
.compact-panel{max-width:520px;margin:0 auto}
.compact-panel .card{padding:10px;margin-bottom:8px}
.compact-panel h2{font-size:18px;margin:4px 0 8px}
.compact-panel h3{font-size:14px;margin:5px 0}
.compact-panel .grid{gap:7px}
.compact-panel .stat{padding:8px;font-size:12px}
.compact-panel button{padding:8px 10px;font-size:12px}
</style>

<style>
/* ===== Shri Ji Mess — Premium Medical Campus UI ===== */
:root{
 --bg:#f5f8fc;--card:#ffffff;--text:#18212f;--muted:#718096;
 --brand:#0f766e;--brand2:#22c55e;--accent:#2563eb;--warm:#f59e0b;
 --line:#e6edf4;--shadow:0 12px 35px rgba(15,45,75,.08)
}
body{background:
 radial-gradient(circle at 10% 0%,rgba(37,99,235,.10),transparent 25%),
 radial-gradient(circle at 100% 10%,rgba(16,185,129,.10),transparent 28%),
 #f5f8fc;color:var(--text)}
.app{max-width:760px}
.top{padding:18px 18px 8px;position:sticky;top:0;background:rgba(245,248,252,.86);backdrop-filter:blur(14px);z-index:15}
.brand{font-size:22px;letter-spacing:-.5px;color:#12304a;display:flex;align-items:center;gap:8px}
.brand:before{content:"✚";display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;font-size:18px;box-shadow:0 7px 18px rgba(37,99,235,.22)}
.page{padding:10px 15px 20px}
.card{border:1px solid rgba(220,230,240,.9);border-radius:22px;box-shadow:var(--shadow);padding:17px;margin:13px 0;background:rgba(255,255,255,.94)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b5f66 0%,#116b73 45%,#2563eb 100%);color:#fff;min-height:190px;padding:22px;border:0;box-shadow:0 18px 40px rgba(15,118,110,.22)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero:before{width:180px;height:180px;right:-70px;top:-75px}
.hero:after{width:110px;height:110px;right:90px;bottom:-65px}
.hero h2{font-size:25px;letter-spacing:-.7px;margin-bottom:5px}
.hero .muted,.hero .sub{color:rgba(255,255,255,.76)}
.hero-art{position:absolute;right:16px;bottom:13px;width:130px;height:130px;opacity:.98}
.hero-copy{position:relative;z-index:2;max-width:58%}
.hero-plan{margin-top:18px;display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:800}
.row{gap:10px}
.grid{gap:10px}
.btn{border-radius:14px;background:linear-gradient(135deg,#0f766e,#087f78);box-shadow:0 7px 18px rgba(15,118,110,.16);transition:.18s transform}
.btn:active{transform:scale(.98)}
.btn.secondary{background:#edf7f6;color:#0b716b;box-shadow:none;border:1px solid #d8eeeb}
.btn.danger{background:#fff0f0;color:#c24141;box-shadow:none}
.btn.small{border-radius:11px}
.pill{background:#eef7f4;color:#147365;border:1px solid #dceee9}
.meal{padding:12px 0;border-bottom:1px solid #edf1f5}
.meal-card{padding:14px 15px}
.meal-card h3{margin-bottom:3px}
.meal-card:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:linear-gradient(90deg,#0f766e,#60a5fa);margin-bottom:11px}
.meal .icon{font-size:28px}
.status{padding:5px 8px;border-radius:9px;background:#eef8f1}
.skipped{background:#fff0f0}
.section-title{font-weight:900}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-tile{padding:14px;border-radius:17px;background:linear-gradient(145deg,#fff,#f4f8fb);border:1px solid #e6edf4;text-align:left;box-shadow:0 7px 20px rgba(20,50,80,.05)}
.quick-tile b{display:block;margin-top:6px}
.quick-tile span{font-size:25px}
.notice{border-left:4px solid #f59e0b;background:linear-gradient(90deg,#fffaf0,#fff)}
.bottom{width:min(760px,100%);background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-top:1px solid #e4ebf2;padding-top:8px}
.nav{font-size:10px}
.nav b{font-size:21px}
.nav.active{color:#0f766e}
.role-quick{margin-top:8px}
.role-quick button{background:#fff;border-color:#dce6ef;color:#526477}
.modal .sheet{border-radius:25px 25px 0 0}
.product .pic{border-radius:16px;background:linear-gradient(145deg,#edf7f6,#eef4ff)}

/* ===== Restored base/structural CSS (was accidentally removed with old theme) ===== */
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
h1,h2,h3,p{margin-top:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}
.row{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr}
.sub{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:10px 0 4px}
.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 12px}
.pill{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.status{font-weight:800;font-size:13px}
.present{color:#0f766e}
.skipped{color:#c24141}
.btn{padding:12px 15px;font-weight:800;color:#fff;width:100%;text-align:center;display:inline-block;text-decoration:none}
.btn.green{background:#16a34a;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#0f766e,#087f78)}
.btn.small{width:auto;padding:8px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{font-size:26px}
.hidden{display:none!important}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#30251f;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;display:none}
.modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
.product{display:flex;gap:12px;align-items:center}
.pic{width:68px;height:68px;border-radius:14px;background:#f5e8dd;display:grid;place-items:center;font-size:30px;object-fit:cover}
.price{font-weight:900}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}
.nav{background:none;color:var(--muted);text-align:center}
.nav b{display:block;line-height:22px}
.adminTop{display:flex;gap:8px;overflow:auto;padding:8px 16px}
.tab{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#f3e7de;color:#6c5143;font-weight:800}
.tab.on{background:var(--brand);color:white}
.kitchen{background:#181614;color:#fff;min-height:100vh}
.kitchen .card{background:#26221f;border-color:#3d3732}
@media(min-width:600px){.page{padding:10px 24px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
